[package]
name = "nigchat-application"
version.workspace = true
edition.workspace = true
license.workspace = true

# Depends on `domain` and nothing else that touches the outside world.
# No sqlx, no axum, no reqwest: every use case here is exercisable against
# in-memory fakes of the domain ports.
#
# chrono-tz is the one borderline case and it earns its place — it is a pure
# lookup table with no I/O, and quiet-hours logic is wrong without a real
# timezone database.
[dependencies]
nigchat-domain = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
# Only for `tokio::spawn` in the notification dispatcher — no networking,
# no I/O drivers.
tokio = { workspace = true }
