# The dependency tree now pulls crates published with edition 2024, which needs
# Rust 1.85 or newer. The previous 1.79 pin predates that and fails to even
# parse those manifests.
#
# `stable` is deliberate while the project is young: it tracks whatever the
# team has installed and avoids a download on every machine. Once the build is
# green, pin an exact version here (e.g. channel = "1.90.0") so CI and every
# developer compile with the identical compiler.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
