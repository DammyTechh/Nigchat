# Local stack.
#
# Two API instances behind nginx on purpose. The thing most likely to break in
# this architecture is cross-instance realtime delivery: a message sent to
# instance A must reach a socket held by instance B. Running two locally means
# that path is exercised every day rather than discovered in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nigchat
      POSTGRES_PASSWORD: nigchat
      POSTGRES_DB: nigchat
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nigchat"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    # Presence and rate-limit counters are ephemeral by design; persistence
    # would buy nothing and cost latency.
    command: ["redis-server", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Media never passes through the API — clients get presigned URLs.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nigchat
      MINIO_ROOT_PASSWORD: nigchat123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api-1: &api
    build: .
    environment: &api_env
      BIND_ADDR: 0.0.0.0:8080
      ENVIRONMENT: development
      DATABASE_URL: postgres://nigchat:nigchat@postgres:5432/nigchat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_only_jwt_secret_00000000000000000000000000000000
      HASH_PEPPER: dev_only_hash_pepper_11111111111111111111111111111111
      OTP_DEBUG_ECHO: "true"
      # Safe here: nginx overwrites the header before it reaches the API.
      TRUST_PROXY_HEADERS: "true"
      ENABLE_DOCS: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      RUST_LOG: nigchat_server=debug,nigchat_api=debug,tower_http=info,sqlx=warn
      INSTANCE_ID: api-1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  api-2:
    <<: *api
    environment:
      <<: *api_env
      INSTANCE_ID: api-2

  nginx:
    image: nginx:alpine
    ports: ["8080:8080"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [api-1, api-2]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
