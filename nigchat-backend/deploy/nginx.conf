events { worker_connections 4096; }

http {
  upstream nigchat_api {
    # Round robin, deliberately. No ip_hash, no sticky sessions: if the
    # application ever needs stickiness to behave correctly, the application is
    # broken. Every instance is interchangeable.
    server api-1:8080 max_fails=3 fail_timeout=10s;
    server api-2:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  # Defence in depth: the application rate-limits per user and per phone
  # number, this limits per IP before a request ever reaches Rust.
  limit_req_zone $binary_remote_addr zone=api:16m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:8m rate=1r/s;

  server {
    listen 8080;

    # Media goes to object storage; nothing here needs a large body.
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Auth endpoints get a much tighter budget: they are the ones that cost
    # money (SMS) and the ones worth brute-forcing.
    location /v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://nigchat_api;
    }

    location /v1/ws {
      proxy_pass http://nigchat_api;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Sockets are long lived; do not let the proxy time them out. The
      # application's own 30s heartbeat detects genuinely dead connections.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://nigchat_api;
    }
  }
}
